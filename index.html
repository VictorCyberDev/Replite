<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="description" content="Private queer cinema discovery and verified download catalog." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/ui-v3.css" />
  <title>Replite Cinema</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PRIVATE CINEMA</p>
        <h1>Replite</h1>
      </div>
      <button id="installBtn" class="ghost hidden">Install app</button>
    </header>

    <main>
      <section class="hero">
        <p class="hero-kicker">Horseplay · Taekwondo · The Astronaut Lovers</p>
        <h2>Pick the exact film, then choose the available file quality.</h2>
        <p class="muted">No AI subscription. No movie storage on Vercel. No paste-a-link workflow.</p>
        <form id="searchForm" class="searchbar">
          <input id="searchInput" type="search" placeholder="Search any movie title…" autocomplete="off" />
          <button type="submit">Search</button>
        </form>
        <div class="chips" id="quickChips">
          <button data-filter="taste" class="chip active">Closest to my taste</button>
          <button data-filter="catalog" class="chip">Explore gay cinema</button>
          <button data-filter="unwatched" class="chip">Unwatched</button>
          <button data-filter="watched" class="chip">Watched</button>
        </div>
      </section>

      <section class="stats" aria-label="catalog statistics">
        <div><strong id="catalogCount">0</strong><span>catalog titles</span></div>
        <div><strong id="watchedCount">0</strong><span>marked watched</span></div>
        <div><strong id="downloadCount">AUTO</strong><span>source checks</span></div>
      </section>

      <section class="section-head">
        <div>
          <p class="eyebrow" id="sectionEyebrow">CURATED FIRST</p>
          <h3 id="sectionTitle">Closest to your niche</h3>
        </div>
        <button id="loadCatalogBtn" class="ghost">Load full catalog</button>
      </section>

      <div id="status" class="status"></div>
      <section id="grid" class="movie-grid" aria-live="polite"></section>
      <button id="loadMoreBtn" class="load-more hidden">Show more</button>
    </main>
  </div>

  <dialog id="movieDialog">
    <button id="closeDialog" class="dialog-close" aria-label="Close">×</button>
    <div id="dialogBody"></div>
  </dialog>

  <template id="cardTemplate">
    <article class="movie-card">
      <button class="poster-wrap open-card">
        <img class="poster" alt="" loading="lazy" />
        <span class="score-badge"></span>
      </button>
      <div class="card-body">
        <h4 class="movie-title"></h4>
        <p class="movie-meta"></p>
        <p class="movie-note"></p>
        <div class="card-actions">
          <button class="open-card primary">Open</button>
          <button class="watch-toggle ghost"></button>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="/app-v3.js"></script>
</body>
</html>
